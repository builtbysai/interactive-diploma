<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Interactive Diploma</title>
  <desc id="d">An interactive 3D recreation of Hans Nii Torgbor Sai's Liberty University diploma, rendered in the browser with Three.js.</desc>
  <defs>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7cd80"/>
      <stop offset="0.45" stop-color="#d8b160"/>
      <stop offset="0.75" stop-color="#a07d34"/>
      <stop offset="1" stop-color="#e7cd80"/>
    </linearGradient>
  </defs>

  <!-- parchment -->
  <rect x="0" y="0" width="1200" height="520" fill="#EFEDE7"/>
  <rect x="0" y="0" width="1200" height="520" fill="#DED7CB" opacity="0.25"/>

  <!-- printed edge, like the certificate's own border -->
  <rect x="26" y="26" width="1148" height="468" fill="none" stroke="#16171A" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="36" y="36" width="1128" height="448" fill="none" stroke="#BA923C" stroke-width="1"/>

  <!-- eyebrow -->
  <text x="600" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="6" fill="#2C2F34">LIBERTY UNIVERSITY · CLASS OF 2026</text>

  <!-- gold seal emblem -->
  <g>
    <circle cx="600" cy="208" r="66" fill="none" stroke="url(#goldRing)" stroke-width="5"/>
    <circle cx="600" cy="208" r="55" fill="none" stroke="#BA923C" stroke-width="1.5"/>
    <text x="600" y="227" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#8E162B" letter-spacing="2">LU</text>
  </g>

  <!-- title -->
  <text x="600" y="346" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#16171A">Interactive Diploma</text>

  <!-- subline, the project's own voice -->
  <text x="600" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25" fill="#2C2F34">My diploma, rebuilt as an object you can pick up, rotate, and open — in WebGL.</text>

  <!-- ornament -->
  <g>
    <line x1="440" y1="430" x2="560" y2="430" stroke="#BA923C" stroke-width="1"/>
    <line x1="640" y1="430" x2="760" y2="430" stroke="#BA923C" stroke-width="1"/>
    <rect x="594" y="424" width="12" height="12" transform="rotate(45 600 430)" fill="#8E162B"/>
  </g>

  <!-- honest footer -->
  <text x="600" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3.5" fill="#686A6F">A PERSONAL KEEPSAKE · NOT AN OFFICIAL CREDENTIAL</text>
</svg>
